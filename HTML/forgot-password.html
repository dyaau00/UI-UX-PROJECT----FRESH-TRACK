<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreshTrack - Forgot Password</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="app-header">
    <div style="display: flex; align-items: center; gap: 8px;">
        <span style="font-size: 26px; line-height: 1;">🌿</span>
        <span style="font-weight: 700; font-size: 24px; color: white;">FreshTrack</span>
    </div>
</header>

    <div class="auth-wrapper">
        <div class="auth-card">
            <h2 class="auth-title" style="margin-bottom: 10px;">Forgot Password?</h2>
            <p style="text-align: center; font-size: 15px; margin-bottom: 25px; line-height: 1.4; color: var(--text-dark);">
                Enter your email address and we'll send you a link to reset your password.
            </p>
            
            <form onsubmit="event.preventDefault(); alert('Tautan pemulihan berhasil dikirim!');">
                <div class="form-group">
                    <label for="forgot-email">Email</label>
                    <input type="email" id="forgot-email" class="form-control" required>
                </div>
                
                <button type="submit" class="btn-submit btn-dark-active">Send Reset Link</button>
            </form>
            
            <div class="auth-footer">
                <a href="login.html" class="forgot-link" style="font-weight: 600;">&lt; Back to Login</a>
            </div>
        </div>
    </div>

</body>
</html>
