<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>FreshTrack</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet"/>
<style>
:root {
  --green-dark:  #2d6a2d;
  --green-mid:   #3d8b3d;
  --green-light: #c8e6c8;
  --green-bg:    #eef6ee;
  --white:       #ffffff;
  --text-dark:   #1a1a1a;
  --text-mid:    #555;
  --text-light:  #999;
  --red:         #c0392b;
  --blue:        #2e6e99;
  --radius:      18px;
  --radius-sm:   12px;
  --nav-h:       68px;
  --header-h:    60px;
  --card-shadow: 0 2px 12px rgba(45,106,45,0.10), 0 0 0 1.5px rgba(45,106,45,0.08);
  --card-hover:  0 6px 24px rgba(45,106,45,0.16), 0 0 0 2px rgba(61,139,61,0.18);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;background:#1a2e1a;}
body{font-family:'DM Sans',sans-serif;color:var(--text-dark);}

/* ── PHONE SHELL (desktop preview) ── */
.shell{
  width:100%;max-width:420px;height:100vh;max-height:900px;
  margin:0 auto;position:relative;
  background:var(--green-bg);
  display:flex;flex-direction:column;
  overflow:hidden;
  box-shadow:0 0 60px rgba(0,0,0,0.5);
}
@media(max-width:480px){
  html,body{background:var(--green-bg);}
  .shell{max-width:100%;height:100vh;max-height:none;box-shadow:none;}
}

/* ── HEADER ── */
.header{
  background:var(--green-dark);
  height:var(--header-h);
  display:flex;align-items:center;
  padding:0 16px;gap:10px;
  flex-shrink:0;
  position:relative;z-index:10;
}
.header-back{
  background:rgba(255,255,255,0.18);
  border:none;border-radius:50%;
  width:36px;height:36px;
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:18px;cursor:pointer;
  flex-shrink:0;
  transition:background 0.15s;
}
.header-back:active{background:rgba(255,255,255,0.3);}
.header-logo{display:flex;align-items:center;gap:7px;flex-shrink:0;}
.header-logo-icon{font-size:22px;}
.header-logo-text{color:#fff;font-weight:700;font-size:18px;letter-spacing:-0.3px;}
.header-title{color:#fff;font-family:'DM Serif Display',serif;font-size:17px;flex:1;}
.header-search{
  flex:1;
  background:rgba(255,255,255,0.18);
  border:none;border-radius:999px;
  padding:8px 14px;
  color:#fff;font-family:'DM Sans',sans-serif;font-size:13px;
  outline:none;
}
.header-search::placeholder{color:rgba(255,255,255,0.65);}
.header-action{
  background:rgba(255,255,255,0.18);
  border:none;border-radius:50%;
  width:36px;height:36px;
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:18px;cursor:pointer;
  flex-shrink:0;
}

/* ── SCROLL BODY ── */
.scroll-body{
  flex:1;overflow-y:auto;overflow-x:hidden;
  padding:16px 14px;
  padding-bottom:calc(var(--nav-h) + 16px);
  -webkit-overflow-scrolling:touch;
}
.scroll-body::-webkit-scrollbar{display:none;}

/* ── PAGES ── */
.page{display:none;}
.page.active{display:block;animation:fadeUp 0.22s ease;}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

/* ── SECTION TITLE ── */
.section-title{
  font-family:'DM Serif Display',serif;
  font-size:22px;color:var(--green-dark);
  margin-bottom:14px;
}

/* ── CARD LIST ── */
.card-list{display:flex;flex-direction:column;gap:10px;}
.card-item{
  display:flex;align-items:center;gap:14px;
  background:var(--white);border-radius:var(--radius);
  padding:14px 16px;cursor:pointer;
  box-shadow:var(--card-shadow);
  border:1.5px solid rgba(45,106,45,0.07);
  transition:transform 0.12s,box-shadow 0.15s;
  -webkit-user-select:none;user-select:none;
}
.card-item:active{transform:scale(0.98);box-shadow:var(--card-hover);}
.card-emoji{font-size:28px;flex-shrink:0;width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:12px;}
.card-label{font-size:15px;font-weight:600;line-height:1.3;}
.card-sub{font-size:12px;color:var(--text-light);margin-top:2px;}
.card-arrow{margin-left:auto;color:#ccc;font-size:16px;flex-shrink:0;}

/* ── EXPIRY BADGE ── */
.badge{display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;border-radius:999px;margin-left:5px;vertical-align:middle;}
.badge-urgent{background:#fde8e8;color:#c0392b;}
.badge-warn{background:#fff3cd;color:#856404;}
.badge-ok{background:#d4edda;color:#155724;}

/* ── FOOD DETAIL ── */
.detail-hero{
  background:var(--white);border-radius:var(--radius);
  padding:18px 16px;margin-bottom:12px;
  box-shadow:var(--card-shadow);
  display:flex;align-items:center;gap:14px;
}
.detail-hero-emoji{font-size:48px;line-height:1;}
.detail-hero-name{font-family:'DM Serif Display',serif;font-size:20px;color:var(--green-dark);}
.detail-hero-cat{font-size:13px;color:var(--text-mid);margin-top:3px;}

.form-card{background:var(--white);border-radius:var(--radius);padding:16px;box-shadow:var(--card-shadow);margin-bottom:12px;}
.form-field{margin-bottom:12px;}
.form-label{font-size:12px;font-weight:600;color:var(--text-mid);margin-bottom:5px;display:block;text-transform:uppercase;letter-spacing:0.04em;}
.form-input,.form-select{
  width:100%;padding:12px 14px;
  border-radius:var(--radius-sm);border:1.5px solid #e0e0e0;
  background:#f8fbf8;font-family:'DM Sans',sans-serif;font-size:15px;
  outline:none;transition:border-color 0.15s;appearance:none;
  -webkit-appearance:none;
}
.form-input:focus,.form-select:focus{border-color:var(--green-mid);background:#fff;}
.select-wrap{position:relative;}
.select-wrap::after{content:'▾';position:absolute;right:14px;top:50%;transform:translateY(-50%);pointer-events:none;color:#888;font-size:14px;}
.select-wrap .form-select{padding-right:36px;}
input[type=number]::-webkit-inner-spin-button,
input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0;}
input[type=number]{-moz-appearance:textfield;}

.qty-available{
  background:linear-gradient(135deg,#e8f8ee,#d0f0d8);
  border-radius:var(--radius-sm);padding:12px 14px;
  font-size:14px;color:var(--green-dark);font-weight:600;
  margin-bottom:12px;display:flex;align-items:center;gap:8px;
}

/* ── ACTION BUTTONS ── */
.btn-row{display:flex;gap:8px;flex-wrap:wrap;}
.btn{
  flex:1;min-width:80px;padding:13px 10px;
  border-radius:var(--radius-sm);border:none;
  font-family:'DM Sans',sans-serif;font-size:14px;font-weight:700;
  cursor:pointer;transition:opacity 0.15s,transform 0.1s;
  text-align:center;
}
.btn:active{transform:scale(0.96);}
.btn-green{background:var(--green-dark);color:#fff;}
.btn-red{background:var(--red);color:#fff;}
.btn-blue{background:var(--blue);color:#fff;}
.btn-gray{background:#e8e8e8;color:#555;}

.btn-full{width:100%;padding:15px;border-radius:var(--radius-sm);border:none;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:700;cursor:pointer;transition:opacity 0.15s,transform 0.1s;margin-bottom:8px;}
.btn-full:active{transform:scale(0.98);}

/* ── DASHBOARD STAT BLOCKS ── */
.dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.dash-card{border-radius:var(--radius);padding:16px 14px;color:#fff;font-weight:700;box-shadow:0 4px 16px rgba(0,0,0,0.12);}
.dash-card .ico{font-size:22px;margin-bottom:6px;}
.dash-card .num{font-size:28px;font-family:'DM Serif Display',serif;line-height:1;}
.dash-card .lbl{font-size:11px;opacity:0.88;margin-top:3px;}

/* ── STATS ── */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.stats-mini{background:var(--white);border-radius:var(--radius);padding:14px;box-shadow:var(--card-shadow);}
.stats-mini .sm-ico{font-size:20px;margin-bottom:4px;}
.stats-mini .sm-val{font-size:26px;font-weight:700;font-family:'DM Serif Display',serif;}
.stats-mini .sm-lbl{font-size:11px;color:var(--text-light);margin-top:2px;}
.chart-card{background:var(--white);border-radius:var(--radius);padding:16px;box-shadow:var(--card-shadow);margin-bottom:12px;}
.chart-card-title{font-size:13px;font-weight:700;color:var(--green-dark);margin-bottom:12px;}
.bar-row{display:flex;align-items:flex-end;gap:10px;height:100px;}
.bar-col{display:flex;flex-direction:column;align-items:center;flex:1;gap:3px;height:100%;justify-content:flex-end;}
.bar-fill{width:100%;border-radius:6px 6px 0 0;min-height:4px;}
.bar-lbl{font-size:10px;color:var(--text-mid);text-align:center;line-height:1.2;}
.bar-val{font-size:11px;font-weight:700;}
.stat-bar-wrap{margin:7px 0;}
.stat-bar-label{display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px;}
.stat-bar-track{background:#eef0ee;border-radius:999px;height:8px;overflow:hidden;}
.stat-bar-fill{height:100%;border-radius:999px;transition:width 0.6s ease;}
.donut-row{display:flex;align-items:center;gap:20px;flex-wrap:wrap;}
.donut-legend{display:flex;flex-direction:column;gap:8px;}
.legend-item{display:flex;align-items:center;gap:8px;font-size:13px;}
.legend-dot{width:11px;height:11px;border-radius:50%;flex-shrink:0;}

/* ── PROFILE ── */
.profile-card{background:var(--white);border-radius:var(--radius);padding:16px;box-shadow:var(--card-shadow);margin-bottom:12px;}
.profile-title{font-size:14px;font-weight:700;color:var(--green-dark);margin-bottom:12px;}
.profile-info-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f0f0f0;font-size:14px;}
.profile-info-row:last-child{border-bottom:none;}
.profile-info-key{color:var(--text-mid);font-weight:500;}
.profile-info-val{font-weight:600;text-align:right;}

/* ── EMOJI PICKER ── */
.emoji-picker-wrap{position:relative;}
.emoji-display{width:100%;padding:12px 14px;border-radius:var(--radius-sm);border:1.5px solid #e0e0e0;background:#f8fbf8;cursor:pointer;display:flex;align-items:center;gap:10px;font-size:14px;user-select:none;}
.emoji-display .sel-emoji{font-size:24px;}
.emoji-display .sel-arrow{margin-left:auto;color:#888;font-size:12px;}
.emoji-dropdown{display:none;position:absolute;bottom:calc(100% + 6px);left:0;right:0;background:#fff;border:1.5px solid #ddd;border-radius:var(--radius);box-shadow:0 -8px 32px rgba(0,0,0,0.13);z-index:300;max-height:260px;overflow-y:auto;padding:10px;}
.emoji-dropdown.open{display:block;}
.emoji-group-label{font-size:10px;font-weight:700;color:var(--text-light);text-transform:uppercase;letter-spacing:0.06em;margin:7px 0 4px;padding-bottom:3px;border-bottom:1px solid #eee;}
.emoji-group-label:first-child{margin-top:0;}
.emoji-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:3px;}
.emoji-btn{font-size:22px;padding:6px 4px;border-radius:8px;border:none;background:none;cursor:pointer;text-align:center;transition:background 0.1s;}
.emoji-btn:active{background:var(--green-light);}

/* ── BOTTOM NAV ── */
.bottom-nav{
  height:var(--nav-h);background:var(--white);
  border-top:1.5px solid rgba(45,106,45,0.1);
  display:flex;align-items:stretch;
  flex-shrink:0;position:relative;z-index:20;
  box-shadow:0 -4px 20px rgba(45,106,45,0.08);
}
.nav-item{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;border:none;background:none;cursor:pointer;
  padding:8px 0;transition:opacity 0.15s;
  -webkit-tap-highlight-color:transparent;
}
.nav-item:active{opacity:0.7;}
.nav-item .n-ico{font-size:22px;line-height:1;}
.nav-item .n-lbl{font-size:10px;font-weight:600;color:var(--text-light);transition:color 0.15s;}
.nav-item.active .n-lbl{color:var(--green-dark);}
.nav-item.active .n-ico{filter:drop-shadow(0 0 2px rgba(45,106,45,0.4));}
.nav-active-bar{
  position:absolute;top:0;height:3px;
  background:var(--green-dark);border-radius:0 0 3px 3px;
  width:25%;transition:left 0.25s cubic-bezier(.4,0,.2,1);
}

/* ── FAB ── */
.fab{
  position:absolute;right:16px;bottom:calc(var(--nav-h) + 14px);
  width:52px;height:52px;border-radius:50%;
  background:var(--green-dark);color:#fff;
  border:none;font-size:26px;cursor:pointer;
  box-shadow:0 4px 20px rgba(45,106,45,0.35);
  display:flex;align-items:center;justify-content:center;
  transition:transform 0.15s,box-shadow 0.15s;
  z-index:15;
}
.fab:active{transform:scale(0.92);box-shadow:0 2px 10px rgba(45,106,45,0.25);}
.fab.hidden{display:none;}

/* ── TOAST ── */
.toast{
  position:absolute;bottom:calc(var(--nav-h) + 12px);left:50%;
  transform:translateX(-50%) translateY(20px);
  background:rgba(30,60,30,0.95);color:#fff;
  padding:10px 22px;border-radius:999px;
  font-size:13px;font-weight:600;
  box-shadow:0 4px 20px rgba(0,0,0,0.18);
  z-index:999;opacity:0;transition:opacity 0.25s,transform 0.25s;
  white-space:nowrap;pointer-events:none;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ── EMPTY STATE ── */
.empty{text-align:center;padding:40px 20px;color:var(--text-light);}
.empty .empty-ico{font-size:48px;margin-bottom:12px;}
.empty .empty-txt{font-size:14px;}
</style>
</head>
<body>
<div class="shell">

  <!-- HEADER -->
  <div class="header" id="app-header">
    <div class="header-logo" id="header-logo">
      <span class="header-logo-icon">🌿</span>
      <span class="header-logo-text">FreshTrack</span>
    </div>
    <input class="header-search" id="searchInput" type="text"
      placeholder="🔍  Search food..." oninput="handleSearch(this.value)" />
  </div>

  <!-- SCROLL BODY -->
  <div class="scroll-body" id="scroll-body">

    <!-- CATEGORIES -->
    <div class="page active" id="page-categories">
      <div class="section-title">Categories</div>
      <div class="card-list" id="categories-list"></div>
    </div>

    <!-- FOOD LIST -->
    <div class="page" id="page-foodlist">
      <div class="section-title" id="foodlist-title"></div>
      <div class="card-list" id="foodlist-items"></div>
    </div>

    <!-- FOOD DETAIL -->
    <div class="page" id="page-fooddetail">
      <div class="detail-hero">
        <span id="detail-emoji" style="font-size:48px;line-height:1"></span>
        <div>
          <div id="detail-name" style="font-family:'DM Serif Display',serif;font-size:20px;color:var(--green-dark);"></div>
          <div id="detail-category" style="font-size:13px;color:var(--text-mid);margin-top:3px;"></div>
        </div>
      </div>
      <div class="form-card">
        <div class="qty-available">
          <span>📦</span>
          <span>Available: <strong id="detail-qty"></strong> items</span>
        </div>
        <div class="form-field">
          <label class="form-label">Quantity to Consume / Discard</label>
          <input class="form-input" type="number" id="detail-qty-input" min="1" placeholder="Enter quantity..." />
        </div>
        <div class="form-field">
          <label class="form-label">Expiry Date</label>
          <input class="form-input" type="date" id="detail-expiry-input" />
        </div>
        <div class="btn-row">
          <button class="btn btn-green" onclick="consumeFood()">✓ Consumed</button>
          <button class="btn btn-red"   onclick="discardFood()">🗑 Discard</button>
          <button class="btn btn-blue"  onclick="openEditFood()">✏ Edit</button>
        </div>
      </div>
    </div>

    <!-- ADD FOOD -->
    <div class="page" id="page-addfood">
      <div class="section-title">Add Food</div>
      <div class="form-card">
        <div class="form-field">
          <label class="form-label">Food Name</label>
          <input class="form-input" type="text" id="add-name" placeholder="e.g. Strawberries" />
        </div>
        <div class="form-field">
          <label class="form-label">Category</label>
          <div class="select-wrap">
            <select class="form-select" id="add-category">
              <option value="">Select category...</option>
              <option>Fruits &amp; Vegetables</option>
              <option>Drinks</option>
              <option>Dairy</option>
              <option>Frozen</option>
            </select>
          </div>
        </div>
        <div class="form-field">
          <label class="form-label">Quantity</label>
          <input class="form-input" type="number" id="add-qty" min="1" placeholder="Enter quantity..." />
        </div>
        <div class="form-field">
          <label class="form-label">Expires in (days)</label>
          <input class="form-input" type="number" id="add-expires" min="1" placeholder="e.g. 5" />
        </div>
        <div class="form-field">
          <label class="form-label">Icon</label>
          <div class="emoji-picker-wrap" id="picker-add">
            <div class="emoji-display" onclick="togglePicker('add')">
              <span class="sel-emoji" id="add-icon-display">🍎</span>
              <span style="color:var(--text-mid);font-size:14px;">Choose icon</span>
              <span class="sel-arrow">▲</span>
            </div>
            <div class="emoji-dropdown" id="add-icon-dropdown"></div>
          </div>
          <input type="hidden" id="add-icon" value="🍎" />
        </div>
        <button class="btn-full btn-green" onclick="saveNewFood()">Save Food</button>
        <button class="btn-full btn-gray"  onclick="backToFoodList()">Cancel</button>
      </div>
    </div>

    <!-- EDIT FOOD -->
    <div class="page" id="page-editfood">
      <div class="section-title">Edit Food</div>
      <div class="form-card">
        <div class="form-field">
          <label class="form-label">Food Name</label>
          <input class="form-input" type="text" id="edit-name" />
        </div>
        <div class="form-field">
          <label class="form-label">Category</label>
          <div id="edit-category-display"
            style="padding:12px 14px;border-radius:var(--radius-sm);border:1.5px solid #e0e0e0;background:#f3f7f3;font-size:15px;font-weight:600;color:var(--green-dark);"></div>
          <input type="hidden" id="edit-category" />
        </div>
        <div class="form-field">
          <label class="form-label">Quantity</label>
          <input class="form-input" type="number" id="edit-qty" min="1" placeholder="Enter quantity..." />
        </div>
        <div class="form-field">
          <label class="form-label">Expires in (days)</label>
          <input class="form-input" type="number" id="edit-expires" min="1" placeholder="e.g. 5" />
        </div>
        <div class="form-field">
          <label class="form-label">Icon</label>
          <div class="emoji-picker-wrap" id="picker-edit">
            <div class="emoji-display" onclick="togglePicker('edit')">
              <span class="sel-emoji" id="edit-icon-display">🍎</span>
              <span style="color:var(--text-mid);font-size:14px;">Choose icon</span>
              <span class="sel-arrow">▲</span>
            </div>
            <div class="emoji-dropdown" id="edit-icon-dropdown"></div>
          </div>
          <input type="hidden" id="edit-icon" value="🍎" />
        </div>
        <button class="btn-full btn-green" onclick="saveEditFood()">Save Changes</button>
        <button class="btn-full btn-gray"  onclick="navigate('fooddetail')">Cancel</button>
      </div>
    </div>

    <!-- DASHBOARD -->
    <div class="page" id="page-dashboard">
      <div class="section-title">Dashboard</div>
      <div id="dashboard-content"></div>
    </div>

    <!-- STATISTICS -->
    <div class="page" id="page-statistics">
      <div class="section-title">Statistics</div>
      <div id="statistics-content"></div>
    </div>

    <!-- ACCOUNT -->
    <div class="page" id="page-account">
      <div class="section-title">Account</div>
      <div class="profile-card">
        <div class="profile-title">👤 Profile Information</div>
        <div class="profile-info-row"><span class="profile-info-key">Name</span><span class="profile-info-val" id="acc-name">Revana Alshea</span></div>
        <div class="profile-info-row"><span class="profile-info-key">Email</span><span class="profile-info-val" id="acc-email">revanaalshea@gmail.com</span></div>
        <div class="profile-info-row"><span class="profile-info-key">Role</span><span class="profile-info-val">User</span></div>
        <button class="btn-full btn-green" style="margin-top:14px;" onclick="navigate('editprofile')">Edit Profile</button>
      </div>
      <div class="profile-card">
        <div class="profile-title">📈 Activity Summary</div>
        <div id="acc-summary"></div>
        <button class="btn-full btn-red" style="margin-top:14px;background:#8b2020;" onclick="showToast('Logged out!')">Logout</button>
      </div>
    </div>

    <!-- EDIT PROFILE -->
    <div class="page" id="page-editprofile">
      <div class="section-title">Edit Profile</div>
      <div class="form-card">
        <div class="form-field">
          <label class="form-label">Name</label>
          <input class="form-input" type="text" id="ep-name" value="Revana Alshea" />
        </div>
        <div class="form-field">
          <label class="form-label">Email</label>

</div><!-- /shell -->

<script>
// ── STATE ──
const state = {
  currentPage:'categories', currentCategory:null, currentFoodId:null,
  consumed:0, discarded:0, totalAdded:0, nextId:17,
  profile:{ name:'Revana Alshea', email:'revanaalshea@gmail.com' },
  foods:[
    {id:1, name:'Apples',        emoji:'🍎', category:'Fruits & Vegetables', qty:5, expires:3},
    {id:2, name:'Bananas',       emoji:'🍌', category:'Fruits & Vegetables', qty:4, expires:3},
    {id:3, name:'Carrot',        emoji:'🥕', category:'Fruits & Vegetables', qty:6, expires:4},
    {id:4, name:'Tomato',        emoji:'🍅', category:'Fruits & Vegetables', qty:4, expires:4},
    {id:5, name:'Avocado Juice', emoji:'🥑', category:'Drinks',              qty:4, expires:4},
    {id:6, name:'Lemonade',      emoji:'🍋', category:'Drinks',              qty:3, expires:3},
    {id:7, name:'Fresh Coffee',  emoji:'☕', category:'Drinks',              qty:6, expires:2},
    {id:8, name:'Milkshake',     emoji:'🥤', category:'Drinks',              qty:5, expires:4},
    {id:9, name:'Milk',          emoji:'🥛', category:'Dairy',               qty:4, expires:4},
    {id:10,name:'Cheese',        emoji:'🧀', category:'Dairy',               qty:3, expires:3},
    {id:11,name:'Yogurt',        emoji:'🫙', category:'Dairy',               qty:2, expires:1},
    {id:12,name:'Ice Cream',     emoji:'🍦', category:'Dairy',               qty:5, expires:4},
    {id:13,name:'Frozen Pizza',  emoji:'🍕', category:'Frozen',              qty:2, expires:4},
    {id:14,name:'Frozen Nuggets',emoji:'🍱', category:'Frozen',              qty:3, expires:6},
    {id:15,name:'Frozen Peas',   emoji:'🫛', category:'Frozen',              qty:5, expires:5},
    {id:16,name:'Frozen Chicken',emoji:'🍗', category:'Frozen',              qty:2, expires:2},
  ]
};
state.totalAdded = state.foods.reduce((s,f)=>s+f.qty,0);

const CATEGORIES = [
  {name:'Fruits & Vegetables', emoji:'🍏', color:'#e8f8ee', bg:'linear-gradient(135deg,#e8f8ee,#d0f0d8)'},
  {name:'Drinks',              emoji:'🧃', color:'#e8f4fb', bg:'linear-gradient(135deg,#e8f4fb,#cce8f8)'},
  {name:'Dairy',               emoji:'🥛', color:'#fef9ec', bg:'linear-gradient(135deg,#fef9ec,#fdefc8)'},
  {name:'Frozen',              emoji:'❄️',  color:'#eef4fb', bg:'linear-gradient(135deg,#eef4fb,#d8eaf8)'},
];

// nav index map
const NAV_ORDER = ['dashboard','categories','statistics','account'];

function navigate(page) {
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-'+page).classList.add('active');
  state.currentPage = page;
  document.getElementById('scroll-body').scrollTop = 0;

  // update header
  const inCat = ['foodlist','fooddetail','addfood','editfood'].includes(page);
  const inInner = inCat || page==='editprofile';
  const logo = document.getElementById('header-logo');
  const search = document.getElementById('searchInput');
  const backId = 'header-back-btn';
  let existing = document.getElementById(backId);
  if(inInner){
    search.style.display='none';
    if(!existing){
      const b = document.createElement('button');
      b.className='header-back'; b.id=backId; b.innerHTML='←';
      b.onclick = ()=>{
        if(['fooddetail','addfood'].includes(state.currentPage)) backToFoodList();
        else if(state.currentPage==='editfood') navigate('fooddetail');
        else if(state.currentPage==='editprofile') navigate('account');
        else if(state.currentPage==='foodlist') navigate('categories');
        else navigate('categories');
      };
      logo.before(b);
    }
    const titleEl = document.querySelector('.header-title') || (() => {
      const t=document.createElement('div'); t.className='header-title'; logo.after(t); return t;
    })();
    logo.style.display='none';
    const titles={foodlist:state.currentCategory||'',fooddetail:'',addfood:'Add Food',editfood:'Edit Food',editprofile:'Edit Profile'};
    titleEl.textContent = titles[page]||'';
    titleEl.style.display='block';
  } else {
    search.style.display='';
    logo.style.display='flex';
    if(existing) existing.remove();
    const titleEl=document.querySelector('.header-title');
    if(titleEl) titleEl.style.display='none';
  }

  // bottom nav active
  const mainPage = inCat?'categories': page==='editprofile'?'account':page;
  NAV_ORDER.forEach((n,i)=>{
    const btn=document.getElementById('nav-'+n);
    const isActive=n===mainPage;
    if(btn){btn.classList.toggle('active',isActive);
      if(isActive) document.getElementById('nav-bar').style.left=(i*25)+'%';
    }
  });

  // FAB visibility
  document.getElementById('fab').classList.toggle('hidden', page!=='foodlist');

  if(page==='categories')  renderCategories();
  if(page==='foodlist')    renderFoodList();
  if(page==='dashboard')   renderDashboard();
  if(page==='statistics')  renderStats();
  if(page==='account')     renderAccount();
}

function backToFoodList(){ navigate('foodlist'); }

// ── CATEGORIES ──
function renderCategories(){
  const el=document.getElementById('categories-list');
  el.innerHTML=CATEGORIES.map(cat=>{
    const foods=state.foods.filter(f=>f.category===cat.name);
    const total=foods.reduce((s,f)=>s+f.qty,0);
    return `<div class="card-item" onclick="openCategory('${cat.name}')" style="background:${cat.bg};">
      <div class="card-emoji" style="background:rgba(255,255,255,0.5)">${cat.emoji}</div>
      <div style="flex:1">
        <div class="card-label">${cat.name}</div>
        <div class="card-sub">${foods.length} items · ${total} units</div>
      </div>
      <span class="card-arrow">›</span>
    </div>`;
  }).join('');
}

// ── FOOD LIST ──
function openCategory(catName){ state.currentCategory=catName; navigate('foodlist'); }

function renderFoodList(){
  const cat=state.currentCategory;
  const catInfo=CATEGORIES.find(c=>c.name===cat);
  const foods=state.foods.filter(f=>f.category===cat&&f.qty>0);
  document.getElementById('foodlist-title').textContent=cat;
  // update header title
  const t=document.querySelector('.header-title');
  if(t) t.textContent=cat;
  const el=document.getElementById('foodlist-items');
  if(!foods.length){
    el.innerHTML=`<div class="empty"><div class="empty-ico">🥬</div><div class="empty-txt">No items yet!<br>Tap + to add food.</div></div>`;
    return;
  }
  const bg=catInfo?catInfo.bg:'#fff';
  el.innerHTML=foods.map(f=>`
    <div class="card-item" onclick="openFoodDetail(${f.id})" style="background:${bg}">
      <div class="card-emoji" style="background:rgba(255,255,255,0.5)">${f.emoji}</div>
      <div style="flex:1">
        <div class="card-label">${f.name} ${badge(f.expires)}</div>
        <div class="card-sub">Count: ${f.qty} · Expires in ${f.expires}d</div>
      </div>
      <span class="card-arrow">›</span>
    </div>`).join('');
}

function badge(d){
  if(d<=1) return `<span class="badge badge-urgent">${d}d</span>`;
  if(d<=3) return `<span class="badge badge-warn">${d}d</span>`;
  return `<span class="badge badge-ok">${d}d</span>`;
}

// ── FOOD DETAIL ──
function openFoodDetail(id){ state.currentFoodId=id; navigate('fooddetail'); renderFoodDetail(); }

function renderFoodDetail(){
  const f=state.foods.find(f=>f.id===state.currentFoodId); if(!f) return;
  document.getElementById('detail-emoji').textContent=f.emoji;
  document.getElementById('detail-name').textContent=f.name;
  document.getElementById('detail-category').textContent='Category: '+f.category;
  document.getElementById('detail-qty').textContent=f.qty;
  document.getElementById('detail-qty-input').value='';
  const d=new Date(); d.setDate(d.getDate()+f.expires);
  document.getElementById('detail-expiry-input').value=d.toISOString().split('T')[0];
  const t=document.querySelector('.header-title');
  if(t) t.textContent=f.name;
}

function consumeFood(){
  const f=state.foods.find(f=>f.id===state.currentFoodId);
  const n=parseInt(document.getElementById('detail-qty-input').value);
  if(!n||n<1){showToast('Enter a quantity first!');return;}
  if(n>f.qty){showToast('Only '+f.qty+' available!');return;}
  f.qty-=n; state.consumed+=n;
  showToast('✓ Consumed '+n+' × '+f.name);
  if(f.qty===0){setTimeout(()=>backToFoodList(),1200);return;}
  renderFoodDetail();
}

function discardFood(){
  const f=state.foods.find(f=>f.id===state.currentFoodId);
  const n=parseInt(document.getElementById('detail-qty-input').value);
  if(!n||n<1){showToast('Enter a quantity first!');return;}
  if(n>f.qty){showToast('Only '+f.qty+' available!');return;}
  f.qty-=n; state.discarded+=n;
  showToast('🗑 Discarded '+n+' × '+f.name);
  if(f.qty===0){setTimeout(()=>backToFoodList(),1200);return;}
  renderFoodDetail();
}

// ── EDIT FOOD ──
function openEditFood(){
  const f=state.foods.find(f=>f.id===state.currentFoodId);
  document.getElementById('edit-name').value=f.name;
  document.getElementById('edit-category').value=f.category;
  document.getElementById('edit-category-display').textContent=f.category;
  document.getElementById('edit-qty').value=f.qty;
  document.getElementById('edit-expires').value=f.expires;
  document.getElementById('edit-icon').value=f.emoji;
  document.getElementById('edit-icon-display').textContent=f.emoji;
  navigate('editfood');
}
function saveEditFood(){
  const f=state.foods.find(f=>f.id===state.currentFoodId);
  f.name=document.getElementById('edit-name').value.trim()||f.name;
  f.category=document.getElementById('edit-category').value;
  f.qty=parseInt(document.getElementById('edit-qty').value)||f.qty;
  f.expires=parseInt(document.getElementById('edit-expires').value)||f.expires;
  f.emoji=document.getElementById('edit-icon').value;
  state.currentCategory=f.category;
  showToast('✓ Changes saved!'); navigate('fooddetail'); renderFoodDetail();
}

// ── ADD FOOD ──
function openAddFood(){
  document.getElementById('add-name').value='';
  document.getElementById('add-category').value=state.currentCategory||'';
  document.getElementById('add-qty').value='';
  document.getElementById('add-expires').value='';
  document.getElementById('add-icon').value='🍎';
  document.getElementById('add-icon-display').textContent='🍎';
  navigate('addfood');
}
function saveNewFood(){
  const name=document.getElementById('add-name').value.trim();
  const cat=document.getElementById('add-category').value;
  const qty=parseInt(document.getElementById('add-qty').value);
  const expires=parseInt(document.getElementById('add-expires').value);
  const emoji=document.getElementById('add-icon').value;
  if(!name||!cat||!qty||!expires){showToast('Please fill all fields!');return;}
  state.foods.push({id:state.nextId++,name,emoji,category:cat,qty,expires});
  state.totalAdded+=qty; state.currentCategory=cat;
  showToast('✓ '+name+' added!'); navigate('foodlist');
}

// ── DASHBOARD ──
function renderDashboard(){
  const total=state.foods.filter(f=>f.qty>0).reduce((s,f)=>s+f.qty,0);
  const urgent=state.foods.filter(f=>f.expires<=2&&f.qty>0);
  const el=document.getElementById('dashboard-content');
  el.innerHTML=`
    <div class="dash-grid">
      <div class="dash-card" style="background:linear-gradient(135deg,#2d7a3e,#52b86a)">
        <div class="ico">📦</div><div class="num">${total}</div><div class="lbl">In Stock</div>
      </div>
      <div class="dash-card" style="background:linear-gradient(135deg,#4a7c3f,#85c66b)">
        <div class="ico">🍽️</div><div class="num">${state.consumed}</div><div class="lbl">Consumed</div>
      </div>
      <div class="dash-card" style="background:linear-gradient(135deg,#b03a2e,#e05c4e)">
        <div class="ico">🗑️</div><div class="num">${state.discarded}</div><div class="lbl">Discarded</div>
      </div>
      <div class="dash-card" style="background:linear-gradient(135deg,#1e6299,#3a9bd5)">
        <div class="ico">⏰</div><div class="num">${urgent.length}</div><div class="lbl">Expiring Soon</div>
      </div>
    </div>
    ${urgent.length>0?`
    <div style="background:#fff8f8;border-radius:var(--radius);padding:14px 16px;border:1.5px solid #f5c6c6;margin-bottom:12px;">
      <div style="font-size:13px;font-weight:700;color:#c0392b;margin-bottom:10px;">⚠️ Expiring in ≤ 2 days</div>
      <div class="card-list">
        ${urgent.map(f=>`<div class="card-item" onclick="state.currentCategory='${f.category}';openFoodDetail(${f.id})" style="background:#fff">
          <div class="card-emoji" style="background:#fde8e8">${f.emoji}</div>
          <div style="flex:1"><div class="card-label">${f.name} <span style="font-weight:400;font-size:12px;color:#aaa">× ${f.qty}</span></div>
          <div class="card-sub" style="color:#c0392b">Expires in ${f.expires} day${f.expires!==1?'s':''}</div></div>
          <span class="card-arrow">›</span></div>`).join('')}
      </div>
    </div>`:`<div style="background:#f0fbf4;border-radius:var(--radius);padding:14px 16px;border:1.5px solid #b7e4c7;font-size:14px;font-weight:600;color:var(--green-dark)">✅ All food is fresh!</div>`}
  `;
}

// ── STATISTICS ──
function renderStats(){
  const foods=state.foods.filter(f=>f.qty>0);
  const totalQty=foods.reduce((s,f)=>s+f.qty,0);
  const totalAll=totalQty+state.consumed+state.discarded;
  const waste=totalAll>0?Math.round((state.discarded/totalAll)*100):0;
  const catColors=['#3cb371','#5bb8c4','#f0a64e','#7b7dd1'];
  const catData=CATEGORIES.map((cat,i)=>({name:cat.name,emoji:cat.emoji,qty:foods.filter(f=>f.category===cat.name).reduce((s,f)=>s+f.qty,0),color:catColors[i]}));
  const maxQty=Math.max(...catData.map(c=>c.qty),1);
  const el=document.getElementById('statistics-content');
  el.innerHTML=`
    <div class="stats-grid">
      <div class="stats-mini"><div class="sm-ico">📦</div><div class="sm-val" style="color:var(--green-dark)">${totalQty}</div><div class="sm-lbl">Current Stock</div></div>
      <div class="stats-mini"><div class="sm-ico">🍽️</div><div class="sm-val" style="color:#3cb371">${state.consumed}</div><div class="sm-lbl">Consumed</div></div>
      <div class="stats-mini"><div class="sm-ico">🗑️</div><div class="sm-val" style="color:#e05c4e">${state.discarded}</div><div class="sm-lbl">Discarded</div></div>
      <div class="stats-mini"><div class="sm-ico">♻️</div><div class="sm-val" style="color:${waste>20?'#c0392b':'#3cb371'}">${waste}%</div><div class="sm-lbl">Waste Rate</div></div>
    </div>
    <div class="chart-card">
      <div class="chart-card-title">📊 Stock by Category</div>
      <div class="bar-row">
        ${catData.map(c=>`<div class="bar-col">
          <div class="bar-val">${c.qty}</div>
          <div class="bar-fill" style="background:${c.color};height:${Math.round((c.qty/maxQty)*80)}px"></div>
          <div class="bar-lbl">${c.emoji}</div>
        </div>`).join('')}
      </div>
    </div>
    <div class="chart-card">
      <div class="chart-card-title">🥧 Usage Breakdown</div>
      <div class="donut-row">
        <svg width="110" height="110" viewBox="0 0 42 42" style="flex-shrink:0">${donutSegs(totalQty,state.consumed,state.discarded)}</svg>
        <div class="donut-legend">
          <div class="legend-item"><div class="legend-dot" style="background:#3cb371"></div><span>In Stock <strong>${totalQty}</strong></span></div>
          <div class="legend-item"><div class="legend-dot" style="background:#5bb8c4"></div><span>Consumed <strong>${state.consumed}</strong></span></div>
          <div class="legend-item"><div class="legend-dot" style="background:#e05c4e"></div><span>Discarded <strong>${state.discarded}</strong></span></div>
        </div>
      </div>
    </div>
    <div class="chart-card">
      <div class="chart-card-title">⏳ Expiry Risk</div>
      ${[{l:'Expires today/tomorrow',d:1,c:'#e05c4e'},{l:'Expires in 2–3 days',d:3,c:'#f0a64e'},{l:'Expires in 4+ days',d:99,c:'#3cb371'}].map(r=>{
        const n=r.d===1?foods.filter(f=>f.expires<=1).reduce((s,f)=>s+f.qty,0):r.d===3?foods.filter(f=>f.expires>=2&&f.expires<=3).reduce((s,f)=>s+f.qty,0):foods.filter(f=>f.expires>=4).reduce((s,f)=>s+f.qty,0);
        const p=totalQty>0?Math.round((n/totalQty)*100):0;
        return `<div class="stat-bar-wrap"><div class="stat-bar-label"><span style="color:${r.c};font-weight:600;font-size:12px">${r.l}</span><span>${n} (${p}%)</span></div><div class="stat-bar-track"><div class="stat-bar-fill" style="width:${p}%;background:${r.c}"></div></div></div>`;
      }).join('')}
    </div>`;
}

function donutSegs(s,c,d){
  const total=s+c+d; if(!total) return `<circle cx="21" cy="21" r="15.9" fill="none" stroke="#eee" stroke-width="6"/>`;
  const cols=['#3cb371','#5bb8c4','#e05c4e'],vals=[s,c,d],r=15.9,circ=2*Math.PI*r;
  let off=0;
  return vals.map((v,i)=>{const dash=circ*v/total;const g=`<circle cx="21" cy="21" r="${r}" fill="none" stroke="${cols[i]}" stroke-width="6" stroke-dasharray="${dash} ${circ-dash}" stroke-dashoffset="${-off}" transform="rotate(-90 21 21)"/>`;off+=dash;return g;}).join('')+`<text x="21" y="24" text-anchor="middle" font-size="7" font-family="DM Sans" fill="#333" font-weight="700">${total}</text>`;
}

// ── ACCOUNT ──
function renderAccount(){
  document.getElementById('acc-name').textContent=state.profile.name;
  document.getElementById('acc-email').textContent=state.profile.email;
  const base=state.totalAdded||1;
  document.getElementById('acc-summary').innerHTML=`
    <div class="stat-bar-wrap"><div class="stat-bar-label"><span>Total Added</span><span><strong>${state.totalAdded}</strong></span></div><div class="stat-bar-track"><div class="stat-bar-fill" style="width:100%;background:#3cb371"></div></div></div>
    <div class="stat-bar-wrap"><div class="stat-bar-label"><span>Consumed</span><span><strong>${state.consumed}</strong></span></div><div class="stat-bar-track"><div class="stat-bar-fill" style="width:${Math.round(state.consumed/base*100)}%;background:#5bb8c4"></div></div></div>
    <div class="stat-bar-wrap"><div class="stat-bar-label"><span>Discarded</span><span><strong>${state.discarded}</strong></span></div><div class="stat-bar-track"><div class="stat-bar-fill" style="width:${Math.round(state.discarded/base*100)}%;background:#e05c4e"></div></div></div>`;
}
function saveProfile(){
  state.profile.name=document.getElementById('ep-name').value.trim()||state.profile.name;
  state.profile.email=document.getElementById('ep-email').value.trim()||state.profile.email;
  showToast('✓ Profile updated!'); navigate('account');
}

// ── SEARCH ──
function handleSearch(q){
  const v=q.trim(); if(!v) return;
  const f=state.foods.find(f=>f.name.toLowerCase().includes(v.toLowerCase())&&f.qty>0);
  if(!f){showToast('No items found.');return;}
  state.currentCategory=f.category; openFoodDetail(f.id);
  document.getElementById('searchInput').value='';
}

// ── TOAST ──
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2200);
}

  {label:'🍖 Meat & Seafood',emojis:['🍗','🍖','🥩','🐟','🦐','🦞','🦀','🦑','🥚','🥓','🍔','🌭','🍳']},

  {label:'🍞 Grains',        emojis:['🍞','🥐','🥖','🫓','🥨','🌮','🌯','🍝','🍜','🍲','🍛','🥟','🍱','🍣']},
  {label:'🍰 Sweets',        emojis:['🍫','🍬','🍭','🍯','🍩','🍪','🍿','🥧','🍡','🧁']},
  {label:'☕ Drinks',        emojis:['☕','🍵','🧋','🥤','🧃','🍶','🍺','🍷','🍹','💧','🫖','🧊']},
  {label:'🧊 Frozen',        emojis:['❄️','🧊','🍕','🍗','🫛','🍦','🍧','🥟']},
];
function buildEmojiDropdown(id){
  const dd=document.getElementById(id+'-icon-dropdown');
  if(dd.dataset.built) return; dd.dataset.built='1';
  dd.innerHTML=EMOJI_GROUPS.map(g=>`<div class="emoji-group-label">${g.label}</div><div class="emoji-grid">${g.emojis.map(e=>`<button type="button" class="emoji-btn" onclick="selectEmoji('${id}','${e}')">${e}</button>`).join('')}</div>`).join('');
}
function togglePicker(id){
  buildEmojiDropdown(id);
  const dd=document.getElementById(id+'-icon-dropdown');
  const open=dd.classList.contains('open');
  document.querySelectorAll('.emoji-dropdown').forEach(d=>d.classList.remove('open'));
  if(!open) dd.classList.add('open');
}
function selectEmoji(id,e){
  document.getElementById(id+'-icon').value=e;
  document.getElementById(id+'-icon-display').textContent=e;
  document.getElementById(id+'-icon-dropdown').classList.remove('open');
}
document.addEventListener('click',e=>{
  if(!e.target.closest('.emoji-picker-wrap')) document.querySelectorAll('.emoji-dropdown').forEach(d=>d.classList.remove('open'));
});

// ── INIT ──
renderCategories();
</script>
</body>
</html>
